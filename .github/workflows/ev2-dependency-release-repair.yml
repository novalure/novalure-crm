name: EV2 bounded dependency release repair
on:
  push:
    branches: [codex/ev2-public-contact-preservation-20261024]
    paths: [.github/workflows/ev2-dependency-release-repair.yml]
permissions:
  contents: write
concurrency:
  group: ev2-dependency-release-repair
  cancel-in-progress: false
jobs:
  dependency-repair:
    if: github.repository == 'novalure/novalure-crm' && github.ref == 'refs/heads/codex/ev2-public-contact-preservation-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify exact baseline and apply only reviewed package changes
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = "6bae762f01153b687b08f881174bc9406e15e536"
          node - <<'JS'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.packageManager !== 'npm@11.9.0' || p.overrides.undici !== '6.28.1' || p.overrides['@vercel/cli-config@0.2.7']) throw new Error('Unexpected package baseline');
          p.overrides.undici = '6.29.1';
          p.overrides['@vercel/cli-config@0.2.7'] = { zod: '4.6.7' };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          JS
          npm update undici zod --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'JS'
          const fs = require('node:fs'), cp = require('node:child_process');
          const before = JSON.parse(cp.execFileSync('git', ['show', 'HEAD:package-lock.json'], {encoding:'utf8'}));
          const after = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const allowed = new Set(['node_modules/undici','node_modules/zod','node_modules/@vercel/cli-config/node_modules/zod']);
          for (const k of new Set([...Object.keys(before.packages),...Object.keys(after.packages)])) {
            if (JSON.stringify(before.packages[k]) !== JSON.stringify(after.packages[k]) && !allowed.has(k)) throw new Error('Unexpected dependency change: ' + k);
          }
          if (after.packages['node_modules/undici'].version !== '6.29.1' || after.packages['node_modules/zod'].version !== '4.6.7' || after.packages['node_modules/@vercel/cli-config/node_modules/zod']) throw new Error('Unexpected resolved dependency versions');
          JS
      - name: Install, audit and verify actual affected application contracts
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          STUDIO_ENQUIRY_TEST_SCHEMA: production
        run: |
          set -eu
          npm ci
          npm run security:production
          npm run typecheck
          node --conditions=react-server --import tsx --test scripts/studio-enquiry-tests.ts
          npm run test:booking:channels
          git diff --check
      - name: Commit only package manifest and generated lockfile to the same branch
        env:
          GH_REPAIR_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if paths != {'package.json','package-lock.json'}:
              raise SystemExit('Unexpected changed paths; no push')
          PY
          git add package.json package-lock.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Patch undici and Zod without changing application or provider versions'
          ASKPASS="$RUNNER_TEMP/ev2-release-askpass.sh"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" "x-access-token";; *Password*) printf "%s\n" "$GH_REPAIR_TOKEN";; esac' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          trap 'rm -f "$ASKPASS"' EXIT
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git -c credential.helper= push origin HEAD:refs/heads/codex/ev2-public-contact-preservation-20261024
