name: Go-live quality gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      qa_profile:
        description: QA credential profile
        type: choice
        required: true
        default: standard
        options:
          - standard
          - isolated-candidate

permissions:
  contents: read

concurrency:
  group: novalure-go-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lockfile, lint, typecheck, tests and build
    runs-on: ubuntu-latest
    env:
      CRM_QA_BROWSER_CHANNEL: chromium
      CRM_QA_PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Verify toolchain
        run: npm run ci:toolchain

      - name: Lint without warnings
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component smoke tests
        run: npm run test:unit

      - name: Design C data provenance and customer self-service regression
        run: npm run test:design-c-integration

      - name: Design C operational reader permissions and source availability
        run: npm run test:crm-operational-readers

      - name: Knowledge Center tenant, role, document, entitlement and scanner isolation
        run: npm run test:knowledge-center

      - name: Knowledge publication, monitoring, scheduler and two-tenant acceptance
        run: npm run test:knowledge-package3

      - name: Combined package 4 migration ledger, runtime roles and rollback
        run: npm run test:package4-migrations

      - name: Security and scope integration tests
        run: npm run test:integration

      - name: Install local QA browser
        run: npx playwright install chromium --with-deps

      - name: Sales transactions against isolated local PostgreSQL
        run: npm run test:sales

      - name: Final sales contract, approval, route and recovery regression
        run: npm run test:sales:final

      - name: G08 Evelyn contract, fail-closed consumer and Preview boundaries
        run: npm run test:g08

      - name: D11 staged Expand, Backfill, Contract and rollback
        run: npm run test:d11:migrations

      - name: Reproducible build metadata endpoint
        run: npm run test:build-metadata

      - name: U1-C03 reconciliation and environment manifests
        run: npm run test:u1-c03:manifests

      - name: Protected preview access contract regression
        run: npm run test:protected-preview-access

      - name: Install PostgreSQL 18 restore clients
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-18

      - name: Neon 061 compatibility and role isolation regression
        run: npm run test:neon:061

      - name: Sales schema upgrade, rollback and native restore
        run: npm run test:sales:migrations

      - name: Form tenant isolation and published lookup
        run: npm run test:form-isolation

      - name: Signed and anonymous website form ingestion
        run: npm run test:website-sales-ingestion

      - name: Confirmed Studio enquiry and private attachment handoff
        run: npm run test:studio-enquiry

      - name: Tenant scoped Studio enquiry detail display
        run: npm run test:studio-enquiry-view

      - name: External integration gateway, public forms and training chat
        # This test owns only disposable local PostgreSQL and starts no server.
        # The later sales E2E process owns and closes its children in finally.
        run: npm run test:external-integration-gateway

      - name: Isolated sales browser flows
        run: npm run qa:sales:e2e

      - name: Website knowledge import UI regression
        run: npm run test:knowledge-import-ui

      - name: Production build
        run: npm run build

      - name: Integrated Design C and Knowledge customer acceptance on isolated PostgreSQL
        run: npm run qa:package4:e2e

      - name: Retain bounded synthetic integration results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crm-package4-synthetic-results
          # Exact result-file allowlist; never upload fixture-private/context files.
          include-hidden-files: true
          path: |
            .npm-cache/qa/package4-migrations.json
            .npm-cache/qa/package4-e2e-result.json
            .npm-cache/qa/design-c-integration/result.json
            .npm-cache/qa/knowledge-browser-result.json
            .npm-cache/qa/package4-integration/result.json
          if-no-files-found: warn

      - name: Reject whitespace errors
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_sha="$EVENT_BASE_SHA"
          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            if ! base_sha="$(git rev-parse HEAD^ 2>/dev/null)"; then
              echo "No parent commit is available; whitespace range check is not applicable."
              exit 0
            fi
          fi
          git diff --check "$base_sha" "$EVENT_HEAD_SHA"

  production-sca:
    name: Production dependency audit and SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Fail on production dependency findings
        run: npm run security:production

      - name: Generate CycloneDX SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx > novalure-production-sbom.cdx.json

      - name: Canonicalize SBOM component inventory
        run: |
          node scripts/canonicalize-sbom.mjs novalure-production-sbom.cdx.json > novalure-production-sbom.components.txt
          sha256sum novalure-production-sbom.components.txt > novalure-production-sbom.components.sha256

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: novalure-production-sbom
          path: |
            novalure-production-sbom.cdx.json
            novalure-production-sbom.components.txt
            novalure-production-sbom.components.sha256
          if-no-files-found: error

  qa-e2e:
    name: Manual trusted-candidate QA regression and tenant diagnostics
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.qa_profile == 'isolated-candidate' && 'novalure-qa-candidate' || 'novalure-qa' }}
    concurrency:
      group: novalure-shared-qa
      cancel-in-progress: false
    needs:
      - quality
      - production-sca
    env:
      NOVALURE_QA_RUN_PREFIX: GOLIVETEST_${{ github.run_id }}_${{ github.run_attempt }}
      NOVALURE_APP_ORIGIN: http://127.0.0.1:3000
      NOVALURE_PUBLIC_SUBMISSION_QA_MODE: "1"
      NOVALURE_QA_BASE_URL: http://127.0.0.1:3000
      NOVALURE_TRUSTED_CLIENT_IP_HEADER: x-forwarded-for
      NOVALURE_QA_PROFILE: ${{ inputs.qa_profile }}
      STUDIO_ENQUIRY_CANDIDATE_ENABLED: ${{ inputs.qa_profile == 'isolated-candidate' && '1' || '0' }}
      STUDIO_ENQUIRY_QA_EMAILS_JSON: '["studio-candidate-${{ github.run_id }}-${{ github.run_attempt }}@example.invalid"]'
      STUDIO_ENQUIRY_QA_PHONES_JSON: '[]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Require all QA secrets and variables
        shell: bash
        env:
          NOVALURE_QA_DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_QA_MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
          NOVALURE_QA_DATABASE_HOST: ${{ secrets.NOVALURE_QA_DATABASE_HOST }}
          NOVALURE_QA_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_ROLE }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_PRODUCTION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_DATABASE_HOST }}
          NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_PASSWORD: ${{ secrets.NOVALURE_QA_PASSWORD }}
          NOVALURE_SESSION_SECRET: ${{ secrets.NOVALURE_QA_SESSION_SECRET }}
          NOVALURE_ABUSE_SECRET: ${{ secrets.NOVALURE_QA_ABUSE_SECRET }}
          NOVALURE_AUTH_ENCRYPTION_KEY: ${{ secrets.NOVALURE_QA_AUTH_ENCRYPTION_KEY }}
          NOVALURE_AUTH_RATE_LIMIT_SECRET: ${{ secrets.NOVALURE_QA_AUTH_RATE_LIMIT_SECRET }}
          OAUTH_STATE_SECRET: ${{ secrets.NOVALURE_QA_OAUTH_STATE_SECRET }}
        run: |
          required=(
            NOVALURE_QA_DATABASE_URL
            NOVALURE_QA_MIGRATION_DATABASE_URL
            NOVALURE_QA_DATABASE_HOST
            NOVALURE_QA_MIGRATION_DATABASE_HOST
            NOVALURE_QA_DATABASE_ROLE
            NOVALURE_QA_MIGRATION_DATABASE_ROLE
            NOVALURE_QA_DATABASE_NAME
            NOVALURE_QA_PROJECT_ID
            NOVALURE_QA_BRANCH_ID
            NOVALURE_PRODUCTION_DATABASE_HOST
            NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST
            NOVALURE_QA_PASSWORD
            NOVALURE_SESSION_SECRET
            NOVALURE_ABUSE_SECRET
            NOVALURE_AUTH_ENCRYPTION_KEY
            NOVALURE_AUTH_RATE_LIMIT_SECRET
            OAUTH_STATE_SECRET
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required; this check cannot be skipped."
              exit 1
            fi
          done

      - name: Reject production or ambiguous database targets
        env:
          DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_QA_DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_QA_DATABASE_HOST: ${{ secrets.NOVALURE_QA_DATABASE_HOST }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_PRODUCTION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_DATABASE_HOST }}
        run: npm run ci:qa-target

      - name: Read-only candidate runtime and migration authentication preflight
        if: inputs.qa_profile == 'isolated-candidate'
        env:
          NOVALURE_QA_DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_QA_MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
          NOVALURE_QA_DATABASE_HOST: ${{ secrets.NOVALURE_QA_DATABASE_HOST }}
          NOVALURE_QA_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_ROLE }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_PRODUCTION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_DATABASE_HOST }}
          NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST }}
        run: node --use-system-ca scripts/qa-auth-preflight.mjs

      - name: Preview checksummed QA migration plan without writes
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
          MIGRATION_PLAN_TOKEN_FILE: ${{ runner.temp }}/novalure-migration-plan-${{ github.run_id }}-${{ github.run_attempt }}
          MIGRATION_TARGET: test
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST }}
          POSTGRES_NEON_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
        run: node scripts/db-migrate.mjs dry-run --plan-token-file="$MIGRATION_PLAN_TOKEN_FILE"

      - name: Apply checksummed QA migrations
        # The default plan excludes 095/096; isolated-candidate applies both explicitly below.
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
          MIGRATION_PLAN_TOKEN_FILE: ${{ runner.temp }}/novalure-migration-plan-${{ github.run_id }}-${{ github.run_attempt }}
          MIGRATION_TARGET: test
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST }}
          POSTGRES_NEON_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
        run: node scripts/db-migrate.mjs up --plan-token-file="$MIGRATION_PLAN_TOKEN_FILE"

      - name: Preview explicit form isolation QA cutover
        if: inputs.qa_profile == 'isolated-candidate'
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
          MIGRATION_PLAN_TOKEN_FILE: ${{ runner.temp }}/novalure-form-isolation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          MIGRATION_TARGET: test
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST }}
          POSTGRES_NEON_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
        run: node scripts/db-migrate.mjs dry-run --only=095_form_tenant_isolation --allow-manual-cutover --plan-token-file="$MIGRATION_PLAN_TOKEN_FILE"

      - name: Apply explicit form isolation QA cutover
        if: inputs.qa_profile == 'isolated-candidate'
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
          MIGRATION_PLAN_TOKEN_FILE: ${{ runner.temp }}/novalure-form-isolation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          MIGRATION_TARGET: test
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST }}
          POSTGRES_NEON_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
        run: node scripts/db-migrate.mjs up --only=095_form_tenant_isolation --allow-manual-cutover --plan-token-file="$MIGRATION_PLAN_TOKEN_FILE"

      - name: Preview explicit external integration gateway QA cutover
        if: inputs.qa_profile == 'isolated-candidate'
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
          MIGRATION_PLAN_TOKEN_FILE: ${{ runner.temp }}/novalure-integration-gateway-plan-${{ github.run_id }}-${{ github.run_attempt }}
          MIGRATION_TARGET: test
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST }}
          POSTGRES_NEON_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
        run: node scripts/db-migrate.mjs dry-run --only=096_public_integration_gateway --allow-manual-cutover --plan-token-file="$MIGRATION_PLAN_TOKEN_FILE"

      - name: Apply explicit external integration gateway QA cutover
        if: inputs.qa_profile == 'isolated-candidate'
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
          MIGRATION_PLAN_TOKEN_FILE: ${{ runner.temp }}/novalure-integration-gateway-plan-${{ github.run_id }}-${{ github.run_attempt }}
          MIGRATION_TARGET: test
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST }}
          POSTGRES_NEON_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
        run: node scripts/db-migrate.mjs up --only=096_public_integration_gateway --allow-manual-cutover --plan-token-file="$MIGRATION_PLAN_TOKEN_FILE"

      - name: Verify gateway runtime binding and retired lookup identity
        if: inputs.qa_profile == 'isolated-candidate'
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
          NOVALURE_QA_DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_QA_DATABASE_HOST: ${{ secrets.NOVALURE_QA_DATABASE_HOST }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_PRODUCTION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_DATABASE_HOST }}
        run: node --use-system-ca scripts/qa-bind-public-form-lookup.mjs

      - name: Bind existing QA runtime role to tenant group
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_ROLE }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
        run: node scripts/qa-bind-runtime-role.mjs

      - name: Capture canonical Growth seed baseline
        shell: bash
        env:
          NOVALURE_QA_DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_QA_DATABASE_HOST: ${{ secrets.NOVALURE_QA_DATABASE_HOST }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_QA_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_MIGRATION_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_ROLE }}
          NOVALURE_PRODUCTION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_DATABASE_HOST }}
          NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST }}
          MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          fingerprint="$(npm run --silent qa:tenant-isolation -- --operator-only | sed -n 's/^GROWTH_CANONICAL_SEED_FINGERPRINT=//p')"
          test -n "$fingerprint"
          echo "GROWTH_CANONICAL_SEED_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

      - name: Quarantine stale active Growth RLS probes
        env:
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_MIGRATION_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_ROLE }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
        run: node scripts/qa-growth-rls-probe.mjs quarantine-stale

      - name: Reset synthetic QA run
        env:
          NOVALURE_QA_DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_QA_DATABASE_HOST: ${{ secrets.NOVALURE_QA_DATABASE_HOST }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_PRODUCTION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_DATABASE_HOST }}
        run: npm run qa:livegang:reset -- --cleanup-only

      - name: Verify cleanup preserves canonical Growth seeds
        env:
          NOVALURE_QA_DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_QA_DATABASE_HOST: ${{ secrets.NOVALURE_QA_DATABASE_HOST }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_QA_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_MIGRATION_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_ROLE }}
          NOVALURE_PRODUCTION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_DATABASE_HOST }}
          NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST }}
          MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
        run: npm run qa:tenant-isolation -- --operator-only

      - name: Seed two or more isolated QA workspaces
        # Provision only run-scoped QA workspaces, memberships and permissions
        # through the separate owner connection. Application fixtures still use
        # novalure_app with a transaction-local tenant/actor context.
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
          NOVALURE_QA_DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_QA_DATABASE_HOST: ${{ secrets.NOVALURE_QA_DATABASE_HOST }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_MIGRATION_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_ROLE }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_PRODUCTION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_DATABASE_HOST }}
          NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_SEED_PASSWORD: ${{ secrets.NOVALURE_QA_PASSWORD }}
        run: npm run qa:livegang:seed

      - name: Verify synthetic QA seeding preserves canonical Growth seeds
        env:
          NOVALURE_QA_DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_QA_DATABASE_HOST: ${{ secrets.NOVALURE_QA_DATABASE_HOST }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_QA_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_MIGRATION_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_ROLE }}
          NOVALURE_PRODUCTION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_DATABASE_HOST }}
          NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST }}
          MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
        run: npm run qa:tenant-isolation -- --operator-only

      - name: Build the production artifact
        run: npm run build

      - name: Start production server
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_STUDIO_INGESTION_SECRET: ${{ secrets.NOVALURE_QA_STUDIO_INGESTION_SECRET }}
          STUDIO_ENQUIRY_SIGNING_SECRET: ${{ secrets.NOVALURE_QA_STUDIO_INGESTION_SECRET }}
          NOVALURE_QA_DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_QA_DATABASE_HOST: ${{ secrets.NOVALURE_QA_DATABASE_HOST }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_PRODUCTION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_DATABASE_HOST }}
          NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST }}
          NOVALURE_LOGIN_PASSCODE: ${{ secrets.NOVALURE_QA_PASSWORD }}
          NOVALURE_ABUSE_SECRET: ${{ secrets.NOVALURE_QA_ABUSE_SECRET }}
          NOVALURE_AUTH_ENCRYPTION_KEY: ${{ secrets.NOVALURE_QA_AUTH_ENCRYPTION_KEY }}
          NOVALURE_AUTH_RATE_LIMIT_SECRET: ${{ secrets.NOVALURE_QA_AUTH_RATE_LIMIT_SECRET }}
          NOVALURE_SESSION_SECRET: ${{ secrets.NOVALURE_QA_SESSION_SECRET }}
          OAUTH_STATE_SECRET: ${{ secrets.NOVALURE_QA_OAUTH_STATE_SECRET }}
        run: |
          if [ "$STUDIO_ENQUIRY_CANDIDATE_ENABLED" = "1" ]; then
            node --import tsx --input-type=module -e 'import { studioEnquiryCandidateBinding } from "./src/lib/studio-enquiry-candidate.ts"; if (!studioEnquiryCandidateBinding()) { console.error("QA_STUDIO_CANDIDATE_BINDING_INVALID"); process.exitCode=1; }' || exit 1
          fi
          npm run start -- --hostname 127.0.0.1 > /tmp/novalure-livegang.log 2>&1 &
          echo $! > /tmp/novalure-livegang.pid

      - name: Wait for app
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl -fsS "$NOVALURE_QA_BASE_URL/api/health" > /tmp/novalure-health.json; then
              exit 0
            fi
            sleep 2
          done
          node scripts/summarize-app-log.mjs /tmp/novalure-livegang.log
          exit 1

      - name: Run CRM API regression and role-negative tests
        env:
          NOVALURE_QA_DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_QA_DATABASE_HOST: ${{ secrets.NOVALURE_QA_DATABASE_HOST }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_PRODUCTION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_DATABASE_HOST }}
          NOVALURE_QA_PASSWORD: ${{ secrets.NOVALURE_QA_PASSWORD }}
        run: npm run test:e2e

      - name: Run isolated public Form and Website Sales candidate matrix
        if: inputs.qa_profile == 'isolated-candidate'
        env:
          DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_QA_DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_QA_DATABASE_HOST: ${{ secrets.NOVALURE_QA_DATABASE_HOST }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_QA_MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
          NOVALURE_PRODUCTION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_DATABASE_HOST }}
          NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST }}
          STUDIO_ENQUIRY_SIGNING_SECRET: ${{ secrets.NOVALURE_QA_STUDIO_INGESTION_SECRET }}
        run: node --conditions=react-server --import tsx scripts/qa-public-form-candidate.mjs

      - name: Stop production server before RLS diagnostic
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/novalure-livegang.pid ]; then
            kill "$(cat /tmp/novalure-livegang.pid)" || true
          fi

      - name: Provision run-scoped Growth RLS probe
        env:
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_MIGRATION_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_ROLE }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
        run: |
          node scripts/qa-growth-rls-probe.mjs seed
          echo "NOVALURE_QA_GROWTH_RLS_PROBE_PROVISIONED=1" >> "$GITHUB_ENV"

      - name: Run tenant-isolation diagnostics
        env:
          NOVALURE_QA_DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_QA_DATABASE_HOST: ${{ secrets.NOVALURE_QA_DATABASE_HOST }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_QA_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_MIGRATION_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_ROLE }}
          NOVALURE_PRODUCTION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_DATABASE_HOST }}
          NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST }}
          MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
        run: npm run qa:tenant-isolation

      - name: Remove run-scoped Growth RLS probe
        if: always()
        env:
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_MIGRATION_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_ROLE }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
        run: node scripts/qa-growth-rls-probe.mjs cleanup

      - name: Cleanup synthetic QA run
        if: always()
        env:
          NOVALURE_QA_DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_QA_DATABASE_HOST: ${{ secrets.NOVALURE_QA_DATABASE_HOST }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_PRODUCTION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_DATABASE_HOST }}
        run: npm run qa:livegang:reset -- --cleanup-only

      - name: Verify final cleanup preserves canonical Growth seeds
        if: always()
        env:
          NOVALURE_QA_DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_QA_DATABASE_HOST: ${{ secrets.NOVALURE_QA_DATABASE_HOST }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_QA_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_HOST }}
          NOVALURE_QA_MIGRATION_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_ROLE }}
          NOVALURE_PRODUCTION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_DATABASE_HOST }}
          NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_MIGRATION_DATABASE_HOST }}
          MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
        run: npm run qa:tenant-isolation -- --operator-only

      - name: Revoke and verify retired lookup identity after Candidate cleanup
        if: always() && inputs.qa_profile == 'isolated-candidate'
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.NOVALURE_QA_MIGRATION_DATABASE_URL }}
          NOVALURE_QA_DATABASE_URL: ${{ secrets.NOVALURE_QA_DATABASE_URL }}
          NOVALURE_QA_DATABASE_HOST: ${{ secrets.NOVALURE_QA_DATABASE_HOST }}
          NOVALURE_QA_DATABASE_ROLE: ${{ secrets.NOVALURE_QA_DATABASE_ROLE }}
          NOVALURE_QA_DATABASE_NAME: ${{ vars.NOVALURE_QA_DATABASE_NAME }}
          NOVALURE_QA_PROJECT_ID: ${{ vars.NOVALURE_QA_PROJECT_ID }}
          NOVALURE_QA_BRANCH_ID: ${{ vars.NOVALURE_QA_BRANCH_ID }}
          NOVALURE_PRODUCTION_DATABASE_HOST: ${{ secrets.NOVALURE_PRODUCTION_DATABASE_HOST }}
        run: node --use-system-ca scripts/qa-revoke-public-form-lookup.mjs

      - name: Ensure production server is stopped
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/novalure-livegang.pid ]; then
            kill "$(cat /tmp/novalure-livegang.pid)" || true
          fi

      - name: Print app log on failure
        if: failure()
        run: node scripts/summarize-app-log.mjs /tmp/novalure-livegang.log || true
