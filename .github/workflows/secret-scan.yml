name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks full-history and current-tree scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          npm install \
            --prefix /tmp/novalure-gitleaks \
            --package-lock=false \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            @nogoo9/gitleaks-linux-x64@8.30.1-post.3
          scanner=/tmp/novalure-gitleaks/node_modules/@nogoo9/gitleaks-linux-x64/bin/gitleaks
          test "$(sha256sum "$scanner" | cut -d ' ' -f 1)" = "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509"
          test "$($scanner version)" = "8.30.1"

      - name: Scan all commits and the checked-out tree
        shell: bash
        run: |
          set -euo pipefail
          scanner=/tmp/novalure-gitleaks/node_modules/@nogoo9/gitleaks-linux-x64/bin/gitleaks
          history_report=/tmp/novalure-gitleaks-history.json
          tree_report=/tmp/novalure-gitleaks-tree.json
          trap 'rm -f "$history_report" "$tree_report"' EXIT
          "$scanner" git . \
            --log-opts="--all --full-history" \
            --no-banner \
            --no-color \
            --redact=100 \
            --report-format=json \
            --report-path="$history_report"
          "$scanner" dir . \
            --no-banner \
            --no-color \
            --redact=100 \
            --report-format=json \
            --report-path="$tree_report"
          node - "$history_report" "$tree_report" <<'NODE'
          const fs = require("node:fs");
          for (const path of process.argv.slice(2)) {
            const findings = JSON.parse(fs.readFileSync(path, "utf8") || "[]");
            console.log(`${path.includes("history") ? "history" : "tree"}_findings=${findings.length}`);
          }
          NODE
