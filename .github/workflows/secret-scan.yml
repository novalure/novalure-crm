name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks full-history and current-tree scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          npm install \
            --prefix /tmp/novalure-gitleaks \
            --package-lock=false \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            @nogoo9/gitleaks-linux-x64@8.30.1-post.3
          scanner=/tmp/novalure-gitleaks/node_modules/@nogoo9/gitleaks-linux-x64/bin/gitleaks
          test "$(sha256sum "$scanner" | cut -d ' ' -f 1)" = "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509"
          test "$($scanner version)" = "8.30.1"

      - name: Scan all commits and the checked-out tree
        shell: bash
        run: |
          set -euo pipefail
          scanner=/tmp/novalure-gitleaks/node_modules/@nogoo9/gitleaks-linux-x64/bin/gitleaks
          history_report=/tmp/novalure-gitleaks-history.json
          tree_report=/tmp/novalure-gitleaks-tree.json
          trap 'rm -f "$history_report" "$tree_report"' EXIT
          history_status=0
          "$scanner" git . \
            --log-opts="--all --full-history" \
            --no-banner \
            --no-color \
            --redact=100 \
            --report-format=json \
            --report-path="$history_report" || history_status=$?
          test "$history_status" -le 1
          tree_status=0
          "$scanner" dir . \
            --no-banner \
            --no-color \
            --redact=100 \
            --report-format=json \
            --report-path="$tree_report" || tree_status=$?
          test "$tree_status" -le 1
          node - "$history_report" "$tree_report" <<'NODE'
          const fs = require("node:fs");
          let total = 0;
          const safeText = (value, maximum) => String(value ?? "")
            .replace(/[^A-Za-z0-9._/@+-]/g, "?")
            .slice(0, maximum);
          for (const path of process.argv.slice(2)) {
            const findings = JSON.parse(fs.readFileSync(path, "utf8") || "[]");
            if (!Array.isArray(findings)) throw new Error("Gitleaks report must be an array.");
            const scope = path.includes("history") ? "history" : "tree";
            console.log(`${scope}_findings=${findings.length}`);
            for (const finding of findings) {
              const commit = /^[a-f0-9]{40}$/.test(finding.Commit ?? "") ? finding.Commit : "working-tree";
              const fingerprint = String(finding.Fingerprint ?? "");
              if (!/^[A-Za-z0-9._/@:+-]{1,620}$/.test(fingerprint)) {
                throw new Error("Gitleaks fingerprint is malformed.");
              }
              const line = Number.isSafeInteger(finding.StartLine) && finding.StartLine > 0
                ? finding.StartLine
                : 0;
              console.log([
                `${scope}_finding`,
                `rule=${safeText(finding.RuleID, 120)}`,
                `file=${safeText(finding.File, 260)}`,
                `line=${line}`,
                `commit=${commit}`,
                `fingerprint=${fingerprint}`,
              ].join(" "));
            }
            total += findings.length;
          }
          if (total > 0) process.exitCode = 1;
          NODE
