name: Shared behavior isolation

on:
  push:
    branches: [codex/shared-behavior-foundation-20261026, codex/shared-behavior-package2-20261026, codex/shared-behavior-package3-20261026]
  pull_request:
    paths:
      - src/lib/shared-behavior/**
      - scripts/shared-behavior-*.ts
      - scripts/shared-behavior-*.mjs
      - migrations/staged/shared_behavior*.sql
      - migrations/115_shared_behavior_foundation.sql
      - migrations/116_shared_behavior_package2.sql
      - migrations/117_shared_behavior_package3.sql
      - migrations/118_shared_behavior_personal_runtime.sql
      - config/shared-behavior-migration-contract.json
      - qa/shared-behavior-package3-personal-2026-10-27/**
      - scripts/lib/shared-behavior-migration-contract.mjs
      - scripts/db-migrate.mjs
      - scripts/lib/local-sales-db.mjs
      - .github/workflows/shared-behavior.yml

permissions:
  contents: read

concurrency:
  group: shared-behavior-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - name: Fixed catalog and private data rejection
        run: node --import tsx --test scripts/shared-behavior-tests.ts
      - name: Immutable migration sources, actual predecessor and manual runner chain
        run: node --test scripts/shared-behavior-migration-contract-tests.mjs
      - name: Real disposable PostgreSQL under a nonprivileged OS user
        run: node --conditions=react-server --import tsx --test scripts/shared-behavior-db-tests.ts
      - name: Candidate evaluation, publisher isolation, concurrency and rollback
        run: node --conditions=react-server --import tsx --test scripts/shared-behavior-lifecycle-tests.ts
      - name: CEO and department runtime, compartment RLS and scoped transport
        run: node --conditions=react-server --import tsx --test scripts/shared-behavior-runtime-tests.ts
      - name: Exact native personal signature, private context and workload revocation
        run: node --conditions=react-server --import tsx --test scripts/shared-behavior-personal-tests.ts
